<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="100%" stop-color="#E60073"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="popShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#b30059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Emoji Multieventos Logo vector badge -->
  <g filter="url(#popShadow)">
    <!-- 'EM' Text -->
    <text x="60" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="120" fill="url(#pinkGrad)" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill" letter-spacing="-2">EM</text>

    <!-- Center Party Emoji -->
    <g transform="translate(300, 125)">
      <!-- Face -->
      <circle cx="0" cy="0" r="58" fill="url(#yellowGrad)" stroke="#FFFFFF" stroke-width="6"/>
      <!-- Party Hat -->
      <path d="M-22,-48 L0,-108 L28,-42 Z" fill="#6C5CE7" stroke="#FFFFFF" stroke-width="4"/>
      <path d="M-15,-65 L18,-52" stroke="#FF7675" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-108" r="8" fill="#00CEC9"/>
      <!-- Closed smiling eyes -->
      <path d="M-32,-10 Q-22,-24 -12,-10" fill="none" stroke="#633900" stroke-width="5" stroke-linecap="round"/>
      <path d="M12,-10 Q22,-24 32,-10" fill="none" stroke="#633900" stroke-width="5" stroke-linecap="round"/>
      <!-- Rosy cheeks -->
      <ellipse cx="-32" cy="6" rx="10" ry="6" fill="#FF5E57" opacity="0.6"/>
      <ellipse cx="32" cy="6" rx="10" ry="6" fill="#FF5E57" opacity="0.6"/>
      <!-- Whistle / Party blower -->
      <path d="M2,12 Q14,14 26,10 Q42,6 52,18 Q58,26 48,32 Q38,36 30,22" fill="none" stroke="#74B9FF" stroke-width="8" stroke-linecap="round"/>
      <circle cx="48" cy="24" r="5" fill="#0984E3"/>
    </g>

    <!-- 'JI' Text -->
    <text x="375" y="175" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="120" fill="url(#pinkGrad)" stroke="#FFFFFF" stroke-width="8" paint-order="stroke fill" letter-spacing="-2">JI</text>

    <!-- Subtitle 'MULTIEVENTOS' -->
    <text x="300" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FF007F" font-style="italic" letter-spacing="4" stroke="#FFFFFF" stroke-width="4" paint-order="stroke fill">MULTIEVENTOS</text>
  </g>
</svg>
