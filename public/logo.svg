<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Circular Background and Outer Border -->
  <circle cx="250" cy="250" r="236" fill="#FFFFFF" stroke="#000000" stroke-width="16" />

  <!-- Top Flag / Pennant -->
  <path 
    d="M 250,86 Q 275,88 296,96 Q 276,106 250,114 Z" 
    fill="#000000" 
  />

  <!-- Top Mast Segment -->
  <rect x="247" y="86" width="6" height="42" fill="#000000" />

  <!-- TOP SAIL - Left Black Half -->
  <path 
    d="M 240,126 C 220,132 165,160 162,192 C 160,210 205,222 240,224 C 236,192 236,158 240,126 Z" 
    fill="#000000" 
    stroke="#000000" 
    stroke-width="2" 
    stroke-linejoin="round"
  />

  <!-- TOP SAIL - Right Yellow Half -->
  <path 
    d="M 254,126 C 274,132 325,158 322,192 C 320,210 280,222 254,224 C 258,192 258,158 254,126 Z" 
    fill="#FFDE00" 
    stroke="#000000" 
    stroke-width="5" 
    stroke-linejoin="round"
  />

  <!-- Mast Segment Between Sails -->
  <rect x="247" y="222" width="6" height="20" fill="#000000" />

  <!-- MIDDLE TIER - Left Black Sail -->
  <path 
    d="M 176,242 C 150,248 116,276 112,308 C 120,320 156,322 176,322 C 170,295 170,268 176,242 Z" 
    fill="#000000" 
    stroke="#000000" 
    stroke-width="2" 
    stroke-linejoin="round"
  />

  <!-- MIDDLE TIER - Center Yellow Sail -->
  <path 
    d="M 194,240 C 230,244 262,244 298,240 C 292,267 292,295 298,322 C 262,318 230,318 194,322 C 200,295 200,267 194,240 Z" 
    fill="#FFDE00" 
    stroke="#000000" 
    stroke-width="5" 
    stroke-linejoin="round"
  />

  <!-- MIDDLE TIER - Right Black Sail -->
  <path 
    d="M 316,242 C 342,248 376,276 380,308 C 372,320 336,322 316,322 C 322,295 322,268 316,242 Z" 
    fill="#000000" 
    stroke="#000000" 
    stroke-width="2" 
    stroke-linejoin="round"
  />

  <!-- Mast Segment to Hull -->
  <rect x="247" y="320" width="6" height="18" fill="#000000" />

  <!-- SHIP HULL (Solid Black) -->
  <path 
    d="M 80,336 L 412,336 L 350,412 L 142,412 Z" 
    fill="#000000" 
    stroke="#000000" 
    stroke-width="2" 
    stroke-linejoin="round"
  />
</svg>
